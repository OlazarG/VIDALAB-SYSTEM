<header class="header">
    <div class="header-title">
        <h1>Gestión de Usuarios</h1>
        <p>Administrar acceso al sistema</p>
    </div>
</header>
<div class="content-wrapper" style="display: flex; gap: 20px; padding: 20px;">
    <div class="form-container" style="flex: 1;">
        <h3>Nuevo Usuario</h3>
        <form id="userForm">
            <div class="form-group">
                <label>Nombre de Usuario</label>
                <input type="text" id="newUsername" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="newPassword" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                Crear Usuario
            </button>
        </form>
    </div>
    <div class="table-container" style="flex: 2;">
        <h3>Usuarios Registrados</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>
</div>
