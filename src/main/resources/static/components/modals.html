<!-- Notification Container -->
<div id="notificationContainer" style="position: fixed; top: 20px; right: 20px; z-index: 10000;"></div>

<!-- Invoice Modal -->
<div id="invoiceModal" class="modal-overlay">
    <div class="modal-content">
        <button class="close-modal" onclick="closeInvoiceModal()">&times;</button>
        <h2>Nueva Factura</h2>
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Cliente (RUC/CI)</label>
                <input type="text" id="ruc" list="clientList" placeholder="Ingrese RUC o CI">
                <datalist id="clientList"></datalist>
            </div>
            <div class="form-group full-width">
                <label>Razón Social</label>
                <input type="text" id="razonSocial" readonly>
            </div>
            <div class="form-group">
                <label>Condición</label>
                <select id="invoiceCondition" class="form-control" onchange="toggleCreditFields()">
                    <option value="CONTADO">Contado</option>
                    <option value="CREDITO">Crédito</option>
                </select>
            </div>
            <div class="form-group" id="paymentMethodGroup">
                <label>Medio de Pago</label>
                <select id="invoicePaymentMethod" class="form-control">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Tarjeta">Tarjeta de Crédito/Débito</option>
                    <option value="Transferencia">Transferencia Bancaria</option>
                    <option value="Cheque">Cheque</option>
                </select>
            </div>
            <div class="form-group" id="creditTermGroup" style="display: none;">
                <label>Días de Plazo</label>
                <input type="number" id="invoiceCreditDays" class="form-control" placeholder="Ej: 30">
            </div>
            <div class="form-group full-width">
                <h3>Items</h3>
                <table id="invoiceItemsTable" style="width:100%">
                    <thead>
                        <tr>
                            <th>Descripción</th>
                            <th>Cant.</th>
                            <th>Precio Unit.</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <button type="button" class="btn-secondary" onclick="addInvoiceItem()" style="margin-top:10px">+
                    Agregar Item</button>
            </div>
        </div>
        <div style="margin-top: 2rem; text-align: right;">
            <h3>Total: <span id="invoiceTotal">0</span> Gs</h3>
            <button class="btn-primary" onclick="saveInvoice()" style="margin-left: auto;">Emitir Factura</button>
        </div>
    </div>
</div>

<!-- Export Movements Modal -->
<div id="exportModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 500px;">
        <button class="close-modal" onclick="closeExportModal()">&times;</button>
        <h2>Exportar Movimientos</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Desde</label>
                <input type="date" id="exportDateFrom" class="form-control">
            </div>
            <div class="form-group">
                <label>Hasta</label>
                <input type="date" id="exportDateTo" class="form-control">
            </div>
        </div>
        <div style="margin-top: 2rem; display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn-secondary" onclick="closeExportModal()">Cancelar</button>
            <button class="btn-primary" onclick="executeExport()">
                <i class="fas fa-download"></i> Exportar
            </button>
        </div>
    </div>
</div>

<!-- Client Registration Modal -->
<div id="clientModal" class="modal-overlay">
    <div class="modal-content">
        <button class="close-modal" onclick="closeClientModal()">&times;</button>
        <h2>Registrar Cliente</h2>
        <form id="clientModalForm">
            <input type="hidden" id="clientModalId">
            <div class="form-grid">
                <div class="form-group">
                    <label>RUC / CI</label>
                    <input type="text" id="clientModalRuc" required placeholder="1234567-8">
                </div>
                <div class="form-group">
                    <label>Razón Social</label>
                    <input type="text" id="clientModalName" required placeholder="Nombre o Razón Social">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="clientModalEmail" placeholder="cliente@email.com">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="clientModalPhone" placeholder="09XX...">
                </div>
                <div class="form-group full-width">
                    <label>Dirección</label>
                    <input type="text" id="clientModalAddress" placeholder="Dirección completa">
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                <button type="button" class="btn-secondary" onclick="closeClientModal()"
                    style="flex: 1;">Cancelar</button>
                <button type="submit" class="btn-primary" style="flex: 1;">Guardar Cliente</button>
                <button type="button" class="btn-primary" onclick="saveClientAndRegisterPatient()"
                    style="flex: 1;">Guardar y Registrar Paciente</button>
            </div>
        </form>
    </div>
</div>

<!-- Client Visit History Modal -->
<div id="clientVisitHistoryModal" class="modal-overlay">
    <div class="modal-content">
        <button class="close-modal" onclick="closeVisitHistoryModal()">&times;</button>
        <h2 id="visitHistoryClientName">Expediente del Cliente</h2>
        <div style="margin-top: 1.5rem;">
            <h3>Historial de Visitas</h3>
            <div class="table-container" style="margin-top: 1rem;">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Motivo de Visita</th>
                            <th>Monto</th>
                            <th>Saldo</th>
                            <th>Observación</th>
                        </tr>
                    </thead>
                    <tbody id="visitHistoryTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
