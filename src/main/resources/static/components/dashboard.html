<header class="header">
    <div class="header-title">
        <h1>Facturación Electrónica</h1>
        <p>Emisión y gestión de facturas</p>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <span id="currentUserDisplay" style="font-weight: 500; font-size: 0.9em; color: #555;"></span>
        <form action="/logout" method="post" style="margin: 0;">
            <button type="submit" class="btn-secondary"
                style="background: #e74c3c; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 0.9em;">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </form>
        <button class="btn-primary" onclick="openModal()">
            <i class="fas fa-plus"></i> Nueva Factura
        </button>
    </div>
</header>

<!-- Dashboard Cards -->
<div class="dashboard-cards">
    <div class="card card-blue">
        <div class="card-title">Facturas Hoy</div>
        <div class="card-value">48</div>
        <div class="card-icon"><i class="fas fa-file-invoice"></i></div>
    </div>
    <div class="card card-green">
        <div class="card-title">Monto Total Hoy</div>
        <div class="card-value">Gs 45,320</div>
        <div class="card-icon"><i class="fas fa-money-bill-wave"></i></div>
    </div>
    <div class="card card-purple">
        <div class="card-title">Factura Promedio</div>
        <div class="card-value">Gs 943</div>
        <div class="card-icon"><i class="fas fa-chart-line"></i></div>
    </div>
    <div class="card card-orange">
        <div class="card-title">Anuladas</div>
        <div class="card-value">2</div>
        <div class="card-icon"><i class="fas fa-ban"></i></div>
    </div>
</div>

<!-- Invoice Table -->
<div class="table-controls">
    <div class="filters">
        <button class="filter-btn active">Todas</button>
        <button class="filter-btn">Emitidas</button>
        <button class="filter-btn">Anuladas</button>
        <button class="filter-btn">Contingencia</button>
    </div>
    <div class="search-bar">
        <i class="fas fa-search" style="color: #999;"></i>
        <input type="text" placeholder="Buscar por número, NIT o razón social...">
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>N° Factura</th>
                <th>NIT</th>
                <th>Razón Social</th>
                <th>Fecha/Hora</th>
                <th>Monto (Gs)</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>001-0000001</td>
                <td>1234567890</td>
                <td>Juan Pérez García</td>
                <td>28/10/2025 10:30</td>
                <td>1500.00</td>
                <td><span class="status-badge status-emitida">Emitida</span></td>
                <td class="actions">
                    <i class="fas fa-eye action-btn" title="Ver"></i>
                    <i class="fas fa-download action-btn" title="Descargar"></i>
                    <i class="fas fa-trash action-btn action-delete" title="Anular"></i>
                </td>
            </tr>
        </tbody>
    </table>
</div>
